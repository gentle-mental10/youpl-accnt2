const bd=(T,i)=>T[i.id]?`<span class="bd ${T[i.id]}">${LB[T[i.id]]}</span>`:"";
const HUES={Horror:350,"Sci-Fi":225,Space:225,Fantasy:275,Racing:15,Survival:135,Relaxing:170,Roguelike:300,Rock:5,Pop:320,Electronic:200,"Hip Hop":40,Jazz:30,Metal:0};
const hx=(h,sa,l)=>{sa/=100;l/=100;const k=n=>(n+h/30)%12,a=sa*Math.min(l,1-l),f=n=>Math.round(255*(l-a*Math.max(-1,Math.min(k(n)-3,9-k(n),1)))).toString(16).padStart(2,"0");return"#"+f(0)+f(8)+f(4)};
function genArt(i){ // original generated cover, used until you add a real one
 let sd=[...(i.id+i.title)].reduce((x,c)=>(x*31+c.charCodeAt(0))>>>0,7);const R=()=>(sd=(sd*1664525+1013904223)>>>0)/4294967296;
 const al=i.type==="album",W=300,H=al?300:400,hk=i.attrs.find(a=>HUES[a]!==undefined),h=hk?HUES[hk]:Math.floor(R()*360),h2=(h+40+Math.floor(R()*50))%360;let sh="";
 for(let k=0;k<7;k++){const x=R()*W|0,y=R()*H|0,r=30+R()*90|0,o=(.08+R()*.14).toFixed(2),t=Math.floor(R()*3);
  sh+=t==0?`<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" fill-opacity="${o}"/>`:t==1?`<rect x="${x}" y="${y}" width="${r*1.6|0}" height="${r*1.6|0}" fill="#fff" fill-opacity="${o}" transform="rotate(${R()*90|0} ${x} ${y})"/>`:`<polygon points="${x},${y} ${x+r*2},${y+r} ${x+r*.4|0},${y+r*2}" fill="#fff" fill-opacity="${o}"/>`}
 if(al)sh+='<circle cx="190" cy="115" r="95" fill="#000" fill-opacity=".45"/>'+[80,64,48].map(r=>`<circle cx="190" cy="115" r="${r}" fill="none" stroke="#fff" stroke-opacity=".14" stroke-width="2"/>`).join("")+`<circle cx="190" cy="115" r="26" fill="${hx(h2,80,60)}"/><circle cx="190" cy="115" r="5" fill="#111"/>`;
 const lines=[];let cur="";i.title.split(" ").forEach(w=>{if((cur+" "+w).trim().length>(al?13:11)&&cur){lines.push(cur);cur=w}else cur=(cur+" "+w).trim()});if(cur)lines.push(cur);
 const L=lines.slice(0,3),fs=Math.max(20,Math.min(40,Math.floor((W-36)/(Math.max(...L.map(l=>l.length))*.58)))),y0=H-24-(L.length-1)*fs*1.1;
 const tx=L.map((l,n)=>`<text x="18" y="${y0+n*fs*1.1|0}" font-size="${fs}" font-weight="800" fill="#fff" font-family="Arial Black,Arial,sans-serif">${esc(l)}</text>`).join("");
 const sub=al&&i.sub?`<text x="18" y="${y0-fs-6|0}" font-size="15" fill="#fff" fill-opacity=".85" font-family="Arial,sans-serif">${esc(i.sub)}</text>`:"";
 return`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="g${i.id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${hx(h,70,42)}"/><stop offset="1" stop-color="${hx(h2,70,18)}"/></linearGradient><linearGradient id="s${i.id}" x1="0" y1="0" x2="0" y2="1"><stop offset=".45" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".6"/></linearGradient></defs><rect width="${W}" height="${H}" fill="url(#g${i.id})"/>${sh}<rect width="${W}" height="${H}" fill="url(#s${i.id})"/>${sub}${tx}</svg>`}
function art(i,T,sq){const a=S.art[i.id];
 return`<div class="art ${i.type==="album"?"sq":""}">${a?`<img src="${a}" alt="">`:genArt(i)}${T?bd(T,i):""}</div>`}
function list(){const T=tiers(),q=S.q.toLowerCase();
 const f={match:(a,b)=>S.p[S.tab].length?rank(a,b):a.title.localeCompare(b.title),az:(a,b)=>a.title.localeCompare(b.title),big:(a,b)=>b.mb-a.mb,small:(a,b)=>a.mb-b.mb}[S.sort];
 return shown(S.tab).filter(i=>S.f[S.tab].every(a=>i.attrs.includes(a))&&(S.tier==="all"||T[i.id]===S.tier)&&(i.title+" "+i.sub).toLowerCase().includes(q)).sort(f)}
function render(){const T=tiers(),l=list(),t=S.tab;
 $("#h1").textContent=t==="game"?"Find your next game.":"Find your next album.";
 $("#grid").innerHTML=l.map(i=>`<div class="card" data-id="${i.id}">${art(i,T)}<div class="cb"><b>${esc(i.title)}</b>${i.sub?`<em>${esc(i.sub)}</em>`:""}<span class="sz">${fmt(i.mb)}</span><div class="tags">${i.attrs.map(a=>`<span class="tg ${S.p[t].includes(a)?"on":""}">${a}</span>`).join("")}</div></div></div>`).join("")||'<p class="emp">Nothing matches. Clear a filter or tier.</p>';
 $("#cnt").textContent=l.length+(t==="game"?" games":" albums");
 document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));
 document.querySelectorAll("#pills button").forEach(b=>b.classList.toggle("on",b.dataset.v===S.tier));
 const n=S.p[t].length+S.b[t].length+S.f[t].length;$("#fb").textContent="⚙ Filters"+(n?` (${n})`:"")}

function openItem(id){const i=byId(id),T=tiers(),g=i.type==="game",L=g?"dl":"lib",has=S[L].includes(id);
 $("#dt").innerHTML=`<div class="dwrap"><button class="b" id="bk">‹ Back</button>
 <div class="dp"><div>${art(i,null)}</div><div>
  <div class="tools"><label class="rp">🖼 Replace artwork<input type="file" accept="image/*" hidden id="fi"></label>${S.art[i.id]?'<button class="sm" id="ri">Remove artwork</button>':""}${i.id[0]==="c"?'<button class="sm" id="del">Delete</button>':""}</div>
  <div class="kick">${g?"GAME":"ALBUM"} DETAILS</div><h2>${esc(i.title)}</h2>
  <div class="subt">${g?"Steam / PC game":esc(i.sub)}</div>
  <div class="chp"><span class="ci">${g?"▣":"💿"} ${fmt(i.mb)}</span><span class="ci">${g?"PC":"Album"}</span></div>
  <p class="dsc">${esc(i.desc)}</p><div class="hs">${i.attrs.map(a=>`<span class="tg ${S.p[i.type].includes(a)?"on":""}">${a}</span>`).join("")}</div>
  <button class="pri big ${has?"done":""}" id="dl">${has?(g?"Downloading on your PC":"Added to your library"):(g?"↓ Download on your PC":"+ Add to library")}</button>
  ${more(i,T)}</div></div></div>`;
 $("#dt").classList.add("open");$("#dt").scrollTop=0;
 $("#bk").onclick=()=>$("#dt").classList.remove("open");
 $("#dl").onclick=()=>{S[L]=S[L].includes(id)?S[L].filter(x=>x!==id):[...S[L],id];save();toast(S[L].includes(id)?(g?"Saved to your downloads":"Saved to your library"):"Removed");openItem(id)};
 $("#fi").onchange=async e=>{if(e.target.files[0]){S.art[id]=await shrink(e.target.files[0],i.type);save();render();openItem(id)}};
 if($("#ri"))$("#ri").onclick=()=>{delete S.art[id];save();render();openItem(id)};
 if($("#del"))$("#del").onclick=()=>{if(confirm("Delete this item?")){S.custom=S.custom.filter(x=>x.id!==id);delete S.art[id];save();render();$("#dt").classList.remove("open")}}}
function more(cur,T){const t=cur.type,has=S.p[t].length,sim=i=>i.attrs.filter(a=>cur.attrs.includes(a)).length;
 const l=shown(t).filter(i=>i.id!==cur.id).sort(has?rank:(a,b)=>sim(b)-sim(a)||a.title.localeCompare(b.title));
 // with a taste set: Must Play first, then Recommended; always fill to 4
 const p=has?[...l.filter(i=>T[i.id]==="must"),...l.filter(i=>T[i.id]==="rec"),...l.filter(i=>T[i.id]==="try")].slice(0,4):l.slice(0,4);
 return`<div class="mh"><h3>More for you</h3><span>${has?"Based on your preferences":"Similar to this one. Tune your taste for better picks"}</span></div><div class="mg">${p.map(i=>`<div class="mc" data-id="${i.id}">${art(i,has?T:null)}<b>${esc(i.title)}</b></div>`).join("")}</div>`}
const shrink=(f,type)=>new Promise(r=>{const im=new Image,u=URL.createObjectURL(f),W=360,H=type==="album"?360:480;
 im.onload=()=>{const k=Math.max(W/im.width,H/im.height),w=W/k,h=H/k,c=document.createElement("canvas");c.width=W;c.height=H;
  c.getContext("2d").drawImage(im,(im.width-w)/2,(im.height-h)/2,w,h,0,0,W,H);URL.revokeObjectURL(u);r(c.toDataURL("image/jpeg",.8))};im.src=u});
async function importArt(files){let n=0;
 for(const f of files){const nm=norm(f.name.replace(/\.[^.]+$/,""));let best=null,bs=0;
  for(const i of all()){for(const k of [i.title,i.sub,i.sub+" "+i.title,i.sub+" - "+i.title]){const x=norm(k);if(!x)continue;
   const s=nm===x?1e3:(x.length>3&&nm.includes(x))?x.length:0;if(s>bs){bs=s;best=i}}}
  if(best){S.art[best.id]=await shrink(f,best.type);n++}}
 save();render();toast(`Matched ${n} of ${files.length} images by file name`)}

const HINT={p:"Pick up to 7 you enjoy. Top 2 matches become Must Play, the next 3 Recommended, the rest Try Out.",b:"Anything with even one banned attribute is hidden.",f:"Show only items that have all the attributes you pick."};
function sheet(m){if(m)mode=m;const L=S[mode][S.tab];
 $("#sh").innerHTML=`<div class="pan"><h3 style="margin:0">Tune your ${S.tab==="game"?"game":"album"} taste</h3>
 <div class="sg">${[["p",`I like (${S.p[S.tab].length}/7)`],["b",`Ban (${S.b[S.tab].length})`],["f",`Filter (${S.f[S.tab].length})`]].map(([k,n])=>`<button data-m="${k}" class="${k===mode?"on":""}">${n}</button>`).join("")}</div>
 <p class="hint">${HINT[mode]}</p><div class="chips">${attrsOf(S.tab).map(a=>`<button class="ch ${L.includes(a)?"sel "+(mode==="b"?"b2":""):""}" data-a="${a}">${a}</button>`).join("")}</div>
 <button class="lnk" id="clr">Clear this list</button><button class="pri" id="ok">Show results</button></div>`;$("#sh").classList.add("open")}
function tog(a){const t=S.tab,L=S[mode][t];
 if(L.includes(a))S[mode][t]=L.filter(x=>x!==a);
 else{if(mode==="p"&&L.length>=7)return toast("You can pick up to 7");L.push(a);
  if(mode==="b"){S.p[t]=S.p[t].filter(x=>x!==a);S.f[t]=S.f[t].filter(x=>x!==a)}if(mode==="p")S.b[t]=S.b[t].filter(x=>x!==a)}
 save();sheet();render()}
function addForm(){let sel=[];const t=S.tab,pool=attrsOf(t);
 $("#sh").innerHTML=`<div class="pan"><h3 style="margin:0">Add a ${t}</h3>
 <label class="f">${t==="game"?"Title":"Album name"}</label><input type="text" id="fn" style="width:100%"><label class="f">${t==="game"?"Developer":"Artist"}</label><input type="text" id="fa" style="width:100%">
 <div class="sp"><div><label class="f">Size (MB)</label><input type="number" id="fs" value="100"></div><div><label class="f">Artwork (optional)</label><input type="file" id="fp" accept="image/*"></div></div>
 <label class="f">Description</label><textarea id="fd" rows="2" style="width:100%"></textarea>
 <label class="f" id="fc">Pick exactly 5 attributes (0/5)</label><div class="chips">${pool.map(a=>`<button class="ch" data-q="${a}">${a}</button>`).join("")}</div>
 <button class="pri" id="sv">Save</button><button class="lnk" id="cx">Cancel</button></div>`;
 $("#sh").classList.add("open");let pic="";$("#fp").onchange=async e=>{if(e.target.files[0])pic=await shrink(e.target.files[0],t)};
 $("#sh").onclick=e=>{const b=e.target.closest("button");if(!b)return;
  if(b.dataset.q){const a=b.dataset.q;if(sel.includes(a))sel=sel.filter(x=>x!==a);else if(sel.length<5)sel.push(a);else toast("Exactly 5 attributes");
   document.querySelectorAll("[data-q]").forEach(x=>x.classList.toggle("sel",sel.includes(x.dataset.q)));$("#fc").textContent=`Pick exactly 5 attributes (${sel.length}/5)`}
  if(b.id==="cx")closeSheet();
  if(b.id==="sv"){if(!$("#fn").value.trim())return toast("Add a title");if(sel.length!==5)return toast("Pick exactly 5 attributes");
   const id="c"+Date.now();S.custom.push({id,type:t,title:$("#fn").value.trim(),sub:$("#fa").value.trim(),mb:+$("#fs").value||1,desc:$("#fd").value.trim()||"No description yet.",attrs:sel});
   if(pic)S.art[id]=pic;save();closeSheet();render();toast("Added")}}}
function closeSheet(){$("#sh").classList.remove("open");$("#sh").onclick=shClick}
function shClick(e){const b=e.target.closest("button");if(e.target.id==="sh"||(b&&b.id==="ok"))return closeSheet();if(!b)return;
 if(b.dataset.m)sheet(b.dataset.m);if(b.dataset.a)tog(b.dataset.a);if(b.id==="clr"){S[mode][S.tab]=[];save();sheet();render()}}
$("#sh").onclick=shClick;
$("#fb").onclick=()=>sheet("f");$("#tune").onclick=()=>sheet("p");$("#add").onclick=addForm;
$("#imp").onchange=e=>importArt([...e.target.files]);
$("#rs").onclick=()=>{if(confirm("Reset taste, bans and filters for games and albums? Your artwork stays.")){S.p={game:[],album:[]};S.b={game:[],album:[]};S.f={game:[],album:[]};S.tier="all";S.q="";$("#q").value="";save();render()}};
$("#q").oninput=e=>{S.q=e.target.value;render()};$("#so").onchange=e=>{S.sort=e.target.value;render()};
$("#tabs").onclick=e=>{if(e.target.dataset.t){S.tab=e.target.dataset.t;S.tier="all";render()}};
$("#pills").onclick=e=>{if(e.target.dataset.v){S.tier=e.target.dataset.v;render()}};
$("#grid").onclick=e=>{const c=e.target.closest(".card");if(c)openItem(c.dataset.id)};
$("#dt").addEventListener("click",e=>{const c=e.target.closest(".mc");if(c)openItem(c.dataset.id)});

const ini=n=>(n||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase();
const hue=n=>[...(n||"?")].reduce((x,c)=>x*31+c.charCodeAt(0)|0,7)%360;
const avatar=(u,c="av")=>{const h=hue(u&&u.name);return`<span class="${c}" style="background:linear-gradient(135deg,hsl(${h} 70% 52%),hsl(${(h+50)%360} 70% 36%))">${esc(ini(u&&u.name))}</span>`};
function paintUser(){const u=U.users[U.cur];$("#avb").innerHTML=u?avatar(u)+`<span>${esc(u.name)}</span>`:"Sign in";$("#avb").onclick=profile}
function addUser(u){U.users[u.id]=u;save();hideLogin();loadUser(u.id);toast("Welcome, "+u.name)}
function localUser(){const n=$("#ln").value.trim().replace(/\s+/g," ");if(!n)return toast("Type a name first");
 if(Object.values(U.users).some(u=>u.name.toLowerCase()===n.toLowerCase()))return toast("That name is already taken");
 addUser({id:"u_"+Date.now().toString(36),name:n,email:"Profile on this device",photo:""})}
function showLogin(){const known=Object.values(U.users),can=U.cur&&U.users[U.cur];
 $("#lg").innerHTML=`<div class="lc"><div class="logo"><i>🎮</i>YouPlay</div><h2 style="margin:16px 0 4px">Who’s playing?</h2>
 <p class="hint">${known.length?"Pick a profile. Each one keeps its own downloads, library and taste.":"Create a profile to get started. You can add more later and switch between them."}</p>
 ${known.length?`<div class="pg">${known.map(u=>`<div class="pt" data-u="${u.id}">${avatar(u)}<b>${esc(u.name)}</b></div>`).join("")}</div>`:""}
 <div class="or">${known.length?"Add a new profile":"Your name"}</div><input type="text" id="ln" maxlength="24" placeholder="Type a name">
 <button class="pri" id="lp">Create profile</button>${can?'<button class="lnk" id="lcn" style="margin:0 auto">Cancel</button>':""}</div>`;
 $("#lg").classList.add("open");$("#lp").onclick=localUser;$("#ln").onkeydown=e=>{if(e.key==="Enter")localUser()};
 $("#lg").onclick=e=>{const r=e.target.closest("[data-u]");if(r){hideLogin();loadUser(r.dataset.u)}if(e.target.id==="lcn")hideLogin()}}
const hideLogin=()=>$("#lg").classList.remove("open");
function profile(e){e&&e.stopPropagation();const pr=$("#pr"),u=U.users[U.cur];if(!u)return showLogin();
 pr.innerHTML=`<div class="urow cur">${avatar(u)}<div><b>${esc(u.name)}</b><small>${S.dl.length} downloading · ${S.lib.length} in library</small></div></div>
 ${Object.values(U.users).filter(x=>x.id!==U.cur).map(x=>`<div class="urow" data-sw="${x.id}" style="cursor:pointer">${avatar(x)}<div><b>${esc(x.name)}</b><small>Switch to this profile</small></div></div>`).join("")}
 <button class="it" id="pa">+ Add profile</button><button class="it" id="pd" style="color:#ff7b7b">Delete this profile</button>`;
 pr.classList.toggle("open");
 pr.onclick=ev=>{ev.stopPropagation();const w=ev.target.closest("[data-sw]");if(w){pr.classList.remove("open");loadUser(w.dataset.sw)}
  if(ev.target.id==="pa"){pr.classList.remove("open");showLogin()}
  if(ev.target.id==="pd"){pr.classList.remove("open");if(!confirm("Delete profile “"+u.name+"” and its saved downloads and library?"))return;
   const id=U.cur;delete U.users[id];try{localStorage.removeItem(uk(id))}catch(x){}U.cur=null;save();const rest=Object.keys(U.users);
   if(rest.length)loadUser(rest[0]);else{S.p={game:[],album:[]};S.b={game:[],album:[]};S.f={game:[],album:[]};S.dl=[];S.lib=[];render();paintUser();showLogin()}}}}
document.addEventListener("click",e=>{if(!e.target.closest("#pr"))$("#pr").classList.remove("open")});
function myLib(){const u=U.users[U.cur],gs=S.dl.map(byId).filter(Boolean),as=S.lib.map(byId).filter(Boolean);
 const grid=l=>l.length?`<div class="mg">${l.map(i=>`<div class="mc" data-id="${i.id}">${art(i,null)}<b>${esc(i.title)}</b></div>`).join("")}</div>`:'<p class="hint">Nothing here yet.</p>';
 $("#dt").innerHTML=`<div class="dwrap"><button class="b" id="bk">‹ Back</button><div class="dp" style="display:block"><div class="kick">${esc(u?u.name.toUpperCase():"")}'S LIBRARY</div><h2>My library</h2>
 <div class="mh"><h3>Downloading on your PC</h3><span>${gs.length} games</span></div>${grid(gs)}<div class="mh" style="margin-top:26px"><h3>Albums in your library</h3><span>${as.length} albums</span></div>${grid(as)}</div></div>`;
 $("#dt").classList.add("open");$("#dt").scrollTop=0;$("#bk").onclick=()=>$("#dt").classList.remove("open")}
$("#ml").onclick=myLib;

// ===== Theme: pick your own colors (saved on this device) =====
const TH0={a:"#a63dff",b:"#d63dff",c:"#27f3ff"};
let TH=Object.assign({},TH0,ld("youplay_theme")||{});
const rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
function applyTheme(){const r=document.documentElement.style,A=rgb(TH.a),B=rgb(TH.b);
 r.setProperty("--a",TH.a);r.setProperty("--a2",TH.b);r.setProperty("--cy",TH.c);r.setProperty("--g",A.join(","));r.setProperty("--g2",B.join(","));
 r.setProperty("--bgg","rgb("+A.map(v=>Math.round(v*.45)).join(",")+")");
 r.setProperty("--on",(.299*A[0]+.587*A[1]+.114*A[2])>150?"#14112b":"#fff")}
const saveTheme=()=>{try{localStorage.setItem("youplay_theme",JSON.stringify(TH))}catch(e){}};
const PRE=[["Neon Purple","#a63dff","#d63dff","#27f3ff"],["Neon Pink","#ff2bd6","#ff5c8a","#27f3ff"],["Neon Blue","#2b7bff","#27d3ff","#a6ff4d"],["Neon Green","#2bff88","#d4ff2b","#ff2bd6"],["Sunset","#ff7a1a","#ff2b6a","#ffe14d"],["Crimson","#ff2b4d","#ff7a2b","#27f3ff"]];
function themeSheet(){
 $("#sh").innerHTML=`<div class="pan"><h3 style="margin:0">Make it yours</h3><p class="hint">Pick a preset or choose any colors. Changes apply instantly and are saved.</p>
 <div class="chips">${PRE.map((x,n)=>`<button class="sw" data-pre="${n}"><i style="background:linear-gradient(135deg,${x[1]},${x[2]})"></i>${x[0]}</button>`).join("")}</div>
 <div class="cr"><span>Main color</span><input type="color" data-c="a" value="${TH.a}"></div>
 <div class="cr"><span>Second color (buttons fade to this)</span><input type="color" data-c="b" value="${TH.b}"></div>
 <div class="cr"><span>Highlight color (small labels)</span><input type="color" data-c="c" value="${TH.c}"></div>
 <button class="lnk" id="trs">Reset to default</button><button class="pri" id="ok">Done</button></div>`;
 $("#sh").classList.add("open");
 $("#sh").oninput=e=>{const k=e.target.dataset.c;if(k){TH[k]=e.target.value;applyTheme();saveTheme()}};
 $("#sh").onclick=e=>{const b=e.target.closest("button");
  if(b&&b.dataset.pre){const x=PRE[b.dataset.pre];TH={a:x[1],b:x[2],c:x[3]};applyTheme();saveTheme();themeSheet()}
  else if(b&&b.id==="trs"){TH={...TH0};applyTheme();saveTheme();themeSheet()}
  else shClick(e)}}
$("#th").onclick=themeSheet;applyTheme();
if(U.cur&&U.users[U.cur])loadUser(U.cur);else{render();paintUser();showLogin()}
</script></body></html>
